[package]
name = "vyn-ask"
version = "0.1.0"
edition = "2021"
description = "Terminal client to agent: vyn ask 'goal' with stdin support and history"

[dependencies]
uuid = { version = "1", features = ["v4"] }
vynkor-sdk = "0.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
serde_json = "1"
