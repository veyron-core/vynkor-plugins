# Example kernel config.yaml entry for the `stt` plugin.
# Copy this block into the top-level `plugins:` list of the kernel's
# config.yaml (see repo root config.yaml for the full schema).
#
# `stt` declares zero kernel permissions (same reasoning as `ai`/`tts`):
#   - the cloud provider (openai) routes its multipart upload through the
#     `network` plugin's `http_request` action, so `network` must be
#     registered and running for it to work;
#   - the local provider (`sherpa`) opens no sockets at all — it loads an
#     ONNX model from disk and transcribes in-process.
#
# `stt` reads no config file — the only configuration is env vars listed
# here, read at call time (see src/handler.rs).

plugins:
  - id: stt
    binary: /opt/plugins/stt        # path to the built `stt` binary
    restart: on-failure
    max_restarts: 5
    sandbox: true                   # stt opens no sockets itself; network does
    env:
      # --- Required for the cloud provider only ---------------------------
      # Every env var name a caller is allowed to reference via
      # api_key_env, comma-separated, exact match. Default-deny — omitting
      # this rejects every cloud transcribe request. Without it a caller
      # could name *any* env var this process has (not just a provider
      # key) and get its value sent straight into an outbound request
      # header to a caller-controlled base_url.
      - STT_PLUGIN_ALLOWED_KEY_ENVS=OPENAI_API_KEY
      # OpenAI API key. Callers reference it via "api_key_env": "OPENAI_API_KEY".
      # Resolution is secrets-first: the key may instead live in the `stt`
      # plugin's own `secrets` vault under this exact name, set once via
      #   secret_set {"name": "OPENAI_API_KEY", "value": "sk-..."}
      # The vault wins when both exist; this env var is the fallback (and
      # the only option if the `secrets` plugin isn't running).
      - OPENAI_API_KEY=sk-...
      # --- Required for the local provider (sherpa) ------------------------
      # Directory holding the ONNX model files, and which model family it
      # is. The local provider loads the model lazily on the first
      # transcribe request and caches it for the process lifetime.
      #   transducer: encoder.onnx, decoder.onnx, joiner.onnx, tokens.txt
      #               (e.g. a sherpa-onnx-zipformer-* model pack)
      #   whisper:    encoder.onnx, decoder.onnx, tokens.txt
      #               (e.g. a sherpa-onnx-whisper-* model pack)
      # See README.md for the layout and where to download the files.
      - STT_PLUGIN_LOCAL_MODEL_DIR=/opt/stt-models/zipformer
      - STT_PLUGIN_LOCAL_MODEL_TYPE=transducer
      # Optional: onnxruntime thread count for local transcription.
      # Default 2. Raise for long audio on multicore hosts.
      # - STT_PLUGIN_LOCAL_NUM_THREADS=2
      # Optional: decoding language for whisper-family models (ISO-639-1).
      # Default "en". A caller-supplied language param overrides it.
      # - STT_PLUGIN_LOCAL_LANGUAGE=en
      # --- Optional: energy voice-activity detection on the listen path ----
      # Off by default. When on, the listen accumulator runs a per-chunk RMS
      # VAD and publishes speech boundaries as best-effort events — this is
      # what the daemon's DAEMON_PLUGIN_MODE=vad keys its turn endpointing
      # on ("user stopped talking" instead of a fixed capture window).
      # - STT_PLUGIN_VAD=on
      # Per-chunk RMS threshold on s16 samples (default 500; desktop mics
      # idle under ~200, speech peaks 1000+).
      # - STT_PLUGIN_VAD_RMS_THRESHOLD=500
      # Silence hangover that closes an utterance, ms (default 1200).
      # - STT_PLUGIN_VAD_SILENCE_MS=1200
      # Minimum measured speech before an ending counts, ms (default 240);
      # shorter blips reset quietly without an event.
      # - STT_PLUGIN_VAD_MIN_SPEECH_MS=240
    grace_seconds: 10
    max_procs: 64
    # Local inference loads the model into RAM. Zipformer int8 models are
    # ~50-100 MB; whisper tiny/base a few hundred MB in f32. Keep this
    # above the model size plus workspace. Cloud-only installs can stay
    # at 512.
    max_vmem_mb: 1024
