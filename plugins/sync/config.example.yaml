# sync plugin config. Copy to config.yaml and set data_dir before running.
data_dir: /var/lib/vyn/sync            # required, directory holding sync.db
pool_size: 4                              # connections in the SQLite pool
busy_timeout_ms: 5000                     # SQLite busy timeout
max_value_bytes: 1048576                  # 1 MiB, sync_set value size cap
max_response_bytes: 4194304               # 4 MiB, sync_get_snapshot result size cap
max_db_bytes: 268435456                   # 256 MiB, hard disk quota (SQLITE_FULL past this); 0 disables
heartbeat_ttl_secs: 300                   # heartbeat.* row TTL in seconds; 0 disables pruning
