[package]
name = "speech-listen"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "listen_engine"
path = "src/lib.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sherpa-onnx = "1.13"
