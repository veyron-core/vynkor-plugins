[package]
name = "media-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "media"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "4", default-features = false, features = ["tokio"] }
zvariant = "4"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
anyhow = "1"
async-trait = "0.1"
