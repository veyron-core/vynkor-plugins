[package]
name = "metrics-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "metrics_plugin"
path = "src/lib.rs"

[[bin]]
name = "metrics"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
