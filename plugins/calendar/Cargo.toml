[package]
name = "calendar-plugin"
version = "0.1.1"
edition = "2021"
publish = false

[lib]
name = "calendar_plugin"
path = "src/lib.rs"

[[bin]]
name = "calendar"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
vynkor-wire = "0.0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rrule = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
