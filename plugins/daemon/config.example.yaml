# daemon plugin config. Copy the relevant keys into the plugin's `env:` list
# in the kernel config (or the drop-in's `env:`) — the supervisor exports
# them before spawning. Every key is optional; defaults below.

# Start with the background listen loop ON (default false — enable at
# runtime via daemon_enable instead).
DAEMON_PLUGIN_ENABLED=false

# Voice turn shape: mic capture window and idle gap between loop turns.
DAEMON_PLUGIN_TURN_MS=6000
DAEMON_PLUGIN_GAP_MS=2000

# Capture parameters negotiated with stt_listen_start / mic_start.
DAEMON_PLUGIN_SAMPLE_RATE_HZ=16000
DAEMON_PLUGIN_CHUNK_MS=100
DAEMON_PLUGIN_STREAM_ID=7

# Speech output (tts_synthesize → sound_play). sherpa is fully offline;
# openai/elevenlabs need tts's own key allowlist + vault/env.
DAEMON_PLUGIN_TTS_PROVIDER=sherpa
DAEMON_PLUGIN_TTS_VOICE=af_heart
DAEMON_PLUGIN_TTS_FORMAT=wav

# Agent goal budget per turn, and IPC timeouts (goal runs long — LLM loop).
DAEMON_PLUGIN_MAX_STEPS=6
DAEMON_PLUGIN_TIMEOUT_MS=30000
DAEMON_PLUGIN_GOAL_TIMEOUT_MS=120000

# Secured-kernel only (operator mints per plugin; claims override manifest):
# VEYRON_JWT_SECRET=<kernel jwt_secret>
# VYN_JWT_TOKEN=<jwt with sub=daemon, permissions=[PERMISSION_AUDIO, PERMISSION_EVENT_PUBLISH]>
