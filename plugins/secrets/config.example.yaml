# Kernel config.yaml drop-in for the `secrets` plugin.
#
# Copy this block into the kernel's config.yaml `plugins:` list (or, once
# installed via `vyn plugin install secrets`, into plugins.d/secrets.yaml
# which the installer writes for you).
#
# The kernel supervisor translates each `env:` entry into an environment
# variable of the spawned plugin process.

- id: secrets
  binary: /opt/plugins/secrets
  sandbox: true
  env:
    # REQUIRED — directory holding per-caller encrypted .vault files.
    - SECRETS_PLUGIN_DATA_DIR=/var/lib/vyn/secrets
    # REQUIRED — 32-byte master key as 64 hex chars or 44 base64 chars.
    # Generate with: openssl rand -hex 32
    # Never commit this; put it in the operator's secret store and render it here.
    - SECRETS_PLUGIN_MASTER_KEY=CHANGE_ME_64_HEX_CHARS
    # Optional overrides (defaults shown).
    - SECRETS_PLUGIN_MAX_NAME_BYTES=256
    - SECRETS_PLUGIN_MAX_VALUE_BYTES=262144
  # If sandbox: true with max_fs_access: read-only|none, the vault dir must be
  # writable — add it to writable_paths or every write gets EACCES:
  #   max_fs_access: read-only
  #   writable_paths:
  #     - /var/lib/vyn/secrets
