# gated-write plugin config — copy to the kernel's plugins.d/ drop-in dir.

plugin_id: gated-write
binary: ./target/release/gated-write
restart: on-failure
sandbox: true

# Environment the plugin is spawned with (see config_schema in plugin.json).
env:
  GATED_WRITE_DATA_DIR: /var/lib/vyn/gated-write
  # Comma-separated plugin ids (or prefix.* globs) allowed to call
  # confirm_write. Default: device.* — every D-06 bridge mirror.
  GATED_WRITE_CONFIRM_CALLERS: device.*
