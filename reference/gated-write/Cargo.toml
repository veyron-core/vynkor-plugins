[package]
name = "gated-write-plugin"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "gated_write_plugin"
path = "src/lib.rs"

[[bin]]
name = "gated-write"
path = "src/main.rs"

[dependencies]
vynkor-sdk = "0.0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
